# --- Sensori da Home Assistant (ricevuti via API) ---
sensor:
  # --- Umidità (tile Home + tile Giardino) ---
  - platform: homeassistant
    id: um_giardino
    entity_id: !secret ent_um_giardino
    on_value:
      - lvgl.label.update:
          id: lbl_um_g
          text: !lambda 'return str_sprintf("%.0f%%", x);'
          text_color: !lambda 'return x < 30 ? lv_color_hex(0xD7A24C) : (x > 80 ? lv_color_hex(0x7FB3D5) : lv_color_hex(0x8FBF9F));'
      - lvgl.label.update:
          id: lbl_g_um
          text: !lambda 'return str_sprintf("%.0f%%", x);'
          text_color: !lambda 'return x < 30 ? lv_color_hex(0xD7A24C) : (x > 80 ? lv_color_hex(0x7FB3D5) : lv_color_hex(0x8FBF9F));'
  - platform: homeassistant
    id: um_sala
    entity_id: !secret ent_um_sala
    on_value:
      - lvgl.label.update:
          id: lbl_um_s
          text: !lambda 'return str_sprintf("%.0f%%", x);'
          text_color: !lambda 'return x < 35 ? lv_color_hex(0xD7A24C) : (x > 65 ? lv_color_hex(0x7FB3D5) : lv_color_hex(0x8FBF9F));'
  - platform: homeassistant
    id: um_camera
    entity_id: !secret ent_um_camera
    on_value:
      - lvgl.label.update:
          id: lbl_um_c
          text: !lambda 'return str_sprintf("%.0f%%", x);'
          text_color: !lambda 'return x < 35 ? lv_color_hex(0xD7A24C) : (x > 65 ? lv_color_hex(0x7FB3D5) : lv_color_hex(0x8FBF9F));'
  # --- Energia ---
  - platform: homeassistant
    id: potenza
    entity_id: !secret ent_potenza
    on_value:
      - lvgl.label.update:
          id: lbl_pot
          text: !lambda 'return str_sprintf("%.2f", x);'
  - platform: homeassistant
    id: bolletta
    entity_id: !secret ent_bolletta
    on_value:
      - lvgl.label.update:
          id: lbl_bol
          text: !lambda 'return str_sprintf("%.0f", x);'
          text_color: !lambda 'return x > 140.0 ? lv_color_hex(0xD2645E) : lv_color_hex(0xE6EAF0);'
      - lvgl.label.update:
          id: lbl_e_previsione
          text: !lambda 'return str_sprintf("%.2f €", x);'
          text_color: !lambda 'return x > 140.0 ? lv_color_hex(0xD2645E) : lv_color_hex(0xE6EAF0);'
  # --- Temperature (tile Home + header + tile Giardino) ---
  - platform: homeassistant
    id: temp_giardino
    entity_id: !secret ent_temp_giardino
    on_value:
      - lvgl.label.update:
          id: lbl_t_g
          text: !lambda 'return str_sprintf("%.1f°", x);'
          text_color: !lambda 'return x < 7 ? lv_color_hex(0x7FB3D5) : (x > 33 ? lv_color_hex(0xD7A24C) : lv_color_hex(0x8FBF9F));'
      - lvgl.label.update:
          id: lbl_g_temp
          text: !lambda 'return str_sprintf("%.1f°", x);'
          text_color: !lambda 'return x < 7 ? lv_color_hex(0x7FB3D5) : (x > 33 ? lv_color_hex(0xD7A24C) : lv_color_hex(0x8FBF9F));'
      - lvgl.label.update:
          id: lbl_ext
          text: !lambda 'return str_sprintf("%.1f°", x);'
  - platform: homeassistant
    id: temp_sala
    entity_id: !secret ent_temp_sala
    on_value:
      - lvgl.label.update:
          id: lbl_t_s
          text: !lambda 'return str_sprintf("%.1f°", x);'
          text_color: !lambda 'return x < 18 ? lv_color_hex(0x7FB3D5) : (x > 26 ? lv_color_hex(0xD7A24C) : lv_color_hex(0x8FBF9F));'
      - lvgl.label.update:
          id: lbl_int
          text: !lambda 'return str_sprintf("%.1f°", x);'
  - platform: homeassistant
    id: temp_camera
    entity_id: !secret ent_temp_camera
    on_value:
      - lvgl.label.update:
          id: lbl_t_c
          text: !lambda 'return str_sprintf("%.1f°", x);'
          text_color: !lambda 'return x < 18 ? lv_color_hex(0x7FB3D5) : (x > 26 ? lv_color_hex(0xD7A24C) : lv_color_hex(0x8FBF9F));'
  # --- Energia (pagina Energia) ---
  - platform: homeassistant
    id: costo_oggi
    entity_id: !secret ent_costo_oggi
    on_value:
      - lvgl.label.update:
          id: lbl_e_oggi
          text: !lambda 'return str_sprintf("%.2f €", x);'
          text_color: !lambda 'return x > 5.0 ? lv_color_hex(0xD2645E) : lv_color_hex(0xE6EAF0);'
  - platform: homeassistant
    id: costo_mese_prec
    entity_id: !secret ent_costo_mese_prec
    on_value:
      - lvgl.label.update:
          id: lbl_e_prec
          text: !lambda 'return str_sprintf("%.2f €", x);'
  - platform: homeassistant
    id: consumo_mensile
    entity_id: !secret ent_consumo_mensile
    on_value:
      - lvgl.label.update:
          id: lbl_e_consumo
          text: !lambda 'return str_sprintf("%.0f kWh", x);'
          text_color: !lambda 'return x > 480.0 ? lv_color_hex(0xD2645E) : lv_color_hex(0xE6EAF0);'
  - platform: homeassistant
    id: tesla_costo
    entity_id: !secret ent_tesla_costo
    on_value:
      - lvgl.label.update:
          id: lbl_e_tesla_eur
          text: !lambda 'return str_sprintf("%.2f €", x);'
          text_color: !lambda 'return x > 55.0 ? lv_color_hex(0xD2645E) : lv_color_hex(0xE6EAF0);'
  - platform: homeassistant
    id: tesla_kwh_f1
    entity_id: !secret ent_tesla_kwh_f1
    on_value:
      - lvgl.label.update:
          id: lbl_e_tesla_kwh
          text: !lambda |-
            // In HA non esiste piu' un totale mensile: si somma per fascia.
            // Le fasce non ancora ricevute sono NaN -> valgono 0.
            auto v = [](float s) { return std::isnan(s) ? 0.0f : s; };
            return str_sprintf("%.0f kWh",
                v(id(tesla_kwh_f1).state) + v(id(tesla_kwh_f2).state) + v(id(tesla_kwh_f3).state));
          text_color: !lambda |-
            // Stessa somma del testo: x e' una sola fascia e da sola non dice nulla.
            auto v = [](float s) { return std::isnan(s) ? 0.0f : s; };
            return (v(id(tesla_kwh_f1).state) + v(id(tesla_kwh_f2).state) + v(id(tesla_kwh_f3).state)) > 220.0f
                ? lv_color_hex(0xD2645E) : lv_color_hex(0xE6EAF0);
  - platform: homeassistant
    id: tesla_kwh_f2
    entity_id: !secret ent_tesla_kwh_f2
    on_value:
      - lvgl.label.update:
          id: lbl_e_tesla_kwh
          text: !lambda |-
            // In HA non esiste piu' un totale mensile: si somma per fascia.
            // Le fasce non ancora ricevute sono NaN -> valgono 0.
            auto v = [](float s) { return std::isnan(s) ? 0.0f : s; };
            return str_sprintf("%.0f kWh",
                v(id(tesla_kwh_f1).state) + v(id(tesla_kwh_f2).state) + v(id(tesla_kwh_f3).state));
          text_color: !lambda |-
            // Stessa somma del testo: x e' una sola fascia e da sola non dice nulla.
            auto v = [](float s) { return std::isnan(s) ? 0.0f : s; };
            return (v(id(tesla_kwh_f1).state) + v(id(tesla_kwh_f2).state) + v(id(tesla_kwh_f3).state)) > 220.0f
                ? lv_color_hex(0xD2645E) : lv_color_hex(0xE6EAF0);
  - platform: homeassistant
    id: tesla_kwh_f3
    entity_id: !secret ent_tesla_kwh_f3
    on_value:
      - lvgl.label.update:
          id: lbl_e_tesla_kwh
          text: !lambda |-
            // In HA non esiste piu' un totale mensile: si somma per fascia.
            // Le fasce non ancora ricevute sono NaN -> valgono 0.
            auto v = [](float s) { return std::isnan(s) ? 0.0f : s; };
            return str_sprintf("%.0f kWh",
                v(id(tesla_kwh_f1).state) + v(id(tesla_kwh_f2).state) + v(id(tesla_kwh_f3).state));
          text_color: !lambda |-
            // Stessa somma del testo: x e' una sola fascia e da sola non dice nulla.
            auto v = [](float s) { return std::isnan(s) ? 0.0f : s; };
            return (v(id(tesla_kwh_f1).state) + v(id(tesla_kwh_f2).state) + v(id(tesla_kwh_f3).state)) > 220.0f
                ? lv_color_hex(0xD2645E) : lv_color_hex(0xE6EAF0);
  # --- Giardino: consumo cucina esterna ---
  - platform: homeassistant
    id: consumo_cucina
    entity_id: !secret ent_consumo_cucina
    on_value:
      - lvgl.label.update:
          id: lbl_g_consumo
          text: !lambda 'return str_sprintf("%.0f W", x);'

# --- Persone (stato casa/fuori) ---
text_sensor:
  - platform: homeassistant
    id: pers_1
    entity_id: !secret ent_persona1
    on_value:
      - lvgl.label.update:
          id: lbl_fra
          text: !lambda |-
            // HA riporta "home", "not_home", oppure il nome della zona.
            // Il ramo generico mostra la zona invece di appiattirla su "Fuori".
            if (x == "home") return std::string("Casa");
            if (x == "not_home") return std::string("Fuori");
            return x;
          text_color: !lambda |-
            if (x == "home") return lv_color_hex(0x8FBF9F);      // salvia: in casa
            if (x == "not_home") return lv_color_hex(0x848D9C);  // muted: fuori, posto ignoto
            return lv_color_hex(0x7FB3D5);                        // blu: in una zona nota
  - platform: homeassistant
    id: pers_2
    entity_id: !secret ent_persona2
    on_value:
      - lvgl.label.update:
          id: lbl_cos
          text: !lambda |-
            // HA riporta "home", "not_home", oppure il nome della zona.
            // Il ramo generico mostra la zona invece di appiattirla su "Fuori".
            if (x == "home") return std::string("Casa");
            if (x == "not_home") return std::string("Fuori");
            return x;
          text_color: !lambda |-
            if (x == "home") return lv_color_hex(0x8FBF9F);      // salvia: in casa
            if (x == "not_home") return lv_color_hex(0x848D9C);  // muted: fuori, posto ignoto
            return lv_color_hex(0x7FB3D5);                        // blu: in una zona nota
  # --- Meteo: condizione -> icona MDI e colore ---
  # I glifi sono scritti come universal-character-name C++ (\UXXXXXXXX):
  # qui siamo in un block scalar, YAML non interpreta gli escape, lo fa il compilatore.
  - platform: homeassistant
    id: meteo_cond
    entity_id: !secret ent_meteo
    on_value:
      - lvgl.label.update:
          id: lbl_meteo_icon
          text: !lambda |-
            if (x == "sunny")           return std::string("\U000F0599");
            if (x == "clear-night")     return std::string("\U000F0594");
            if (x == "partlycloudy")    return std::string("\U000F0595");
            if (x == "cloudy")          return std::string("\U000F0590");
            if (x == "fog")             return std::string("\U000F0591");
            if (x == "hail")            return std::string("\U000F0592");
            if (x == "lightning")       return std::string("\U000F0593");
            if (x == "lightning-rainy") return std::string("\U000F067E");
            if (x == "pouring")         return std::string("\U000F0596");
            if (x == "rainy")           return std::string("\U000F0597");
            if (x == "snowy")           return std::string("\U000F0598");
            if (x == "snowy-rainy")     return std::string("\U000F067F");
            if (x == "windy")           return std::string("\U000F059D");
            if (x == "windy-variant")   return std::string("\U000F059E");
            if (x == "exceptional")     return std::string("\U000F05D6");
            return std::string("\U000F0590");  // stato ignoto -> nuvoloso
          text_color: !lambda |-
            // Palette del restyling: sole ambra, notte viola, pioggia/temporale blu,
            // neve/nebbia testo chiaro, nuvole/vento muted, exceptional rosso.
            if (x == "sunny")           return lv_color_hex(0xD7A24C);
            if (x == "clear-night")     return lv_color_hex(0x9E8FC7);
            if (x == "partlycloudy")    return lv_color_hex(0x848D9C);
            if (x == "fog")             return lv_color_hex(0xE6EAF0);
            if (x == "hail")            return lv_color_hex(0xE6EAF0);
            if (x == "snowy")           return lv_color_hex(0xE6EAF0);
            if (x == "snowy-rainy")     return lv_color_hex(0xE6EAF0);
            if (x == "rainy")           return lv_color_hex(0x7FB3D5);
            if (x == "pouring")         return lv_color_hex(0x7FB3D5);
            if (x == "lightning")       return lv_color_hex(0x7FB3D5);
            if (x == "lightning-rainy") return lv_color_hex(0x7FB3D5);
            if (x == "exceptional")     return lv_color_hex(0xD2645E);
            return lv_color_hex(0x848D9C);
  # Stato robot aspirapolvere (pagina Casa)
  - platform: homeassistant
    id: st_vacuum
    entity_id: !secret ent_vacuum
    on_value:
      - lvgl.label.update:
          id: lbl_igor
          text: !lambda |-
            if (x == "cleaning") return std::string("In pulizia");
            if (x == "docked") return std::string("In carica");
            if (x == "returning") return std::string("Rientro");
            if (x == "paused") return std::string("In pausa");
            if (x == "idle") return std::string("Fermo");
            if (x == "error") return std::string("Errore");
            return x;
      # Il testo grande della tile dice cosa succede se premi, non cosa sta facendo.
      - lvgl.label.update:
          id: lbl_igor_act
          text: !lambda |-
            if (x == "cleaning" || x == "returning") return std::string("Alla base");
            return std::string("Avvia");

# Stato switch cucina -> colora i pulsanti quando accesi (pagina Casa)
binary_sensor:
  # --- Giardino: luce cucina esterna (colore se accesa) ---
  - platform: homeassistant
    id: st_luce_cucina
    entity_id: !secret ent_luce_cucina_est
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.widget.update: { id: btn_luce_cucina, bg_color: 0xD7A24C }
            - lvgl.label.update: { id: lbl_btn_luce, text_color: 0x0E1116 }
          else:
            - lvgl.widget.update: { id: btn_luce_cucina, bg_color: 0x232935 }
            - lvgl.label.update: { id: lbl_btn_luce, text_color: 0xE6EAF0 }
  # --- Giardino: portafinestra (icona + testo aperta/chiusa) ---
  - platform: homeassistant
    id: st_porta
    entity_id: !secret ent_portafinestra
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.label.update: { id: lbl_porta, text: "Aperta", text_color: 0xD2645E }
            - lvgl.label.update: { id: lbl_porta_icon, text: "\U000F11DC", text_color: 0xD2645E }
          else:
            - lvgl.label.update: { id: lbl_porta, text: "Chiusa", text_color: 0x8FBF9F }
            - lvgl.label.update: { id: lbl_porta_icon, text: "\U000F11DB", text_color: 0x8FBF9F }

# Orologio via SNTP. Aggiorna ora e data (header Home) con on_time (contesto sicuro).
time:
  - platform: sntp
    id: ora
    timezone: Europe/Rome
    on_time:
      - seconds: /20
        then:
          - lvgl.label.update:
              id: lbl_clock
              text: !lambda |-
                auto t = id(ora).now();
                if (!t.is_valid()) return std::string("--:--");
                char buf[8];
                snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
                return std::string(buf);
          - lvgl.label.update:
              id: lbl_date
              text: !lambda |-
                auto t = id(ora).now();
                if (!t.is_valid()) return std::string("");
                static const char* gg[] = {"Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"};
                static const char* mm[] = {"gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"};
                int dow = t.day_of_week, mo = t.month;
                if (dow < 1 || dow > 7 || mo < 1 || mo > 12) return std::string("");
                char buf[48];
                snprintf(buf, sizeof(buf), "%s %d %s", gg[dow-1], t.day_of_month, mm[mo-1]);
                return std::string(buf);

# --- DISPLAY mipi_rgb: ora pilotato da LVGL (niente lambda/test_card) ---
display:
  - platform: mipi_rgb
    id: lcd
    model: RPI
    auto_clear_enabled: false
    color_order: BGR
    pixel_mode: 16bit
    pclk_frequency: 30MHz   # 50MHz causava crash al boot -> rollback OTA. 30MHz stabile.
    pclk_inverted: true
    dimensions:
      width: 1024
      height: 600
    de_pin: GPIO5
    hsync_pin: GPIO46
    vsync_pin: GPIO3
    pclk_pin: GPIO7
    hsync_pulse_width: 162
    hsync_back_porch: 152
    hsync_front_porch: 48
    vsync_pulse_width: 45
    vsync_back_porch: 13
    vsync_front_porch: 3
    # Ordine fisico Waveshare data0->data15 mappato su RGB565:
    # data0-4 = blue, data5-10 = green, data11-15 = red
    data_pins:
      blue:  [GPIO14, GPIO38, GPIO18, GPIO17, GPIO10]
      green: [GPIO39, GPIO0,  GPIO45, GPIO48, GPIO47, GPIO21]
      red:   [GPIO1,  GPIO2,  GPIO42, GPIO41, GPIO40]

# --- TOUCH GT911 ---
# INT su GPIO4 (diretto ESP32). Reset via IO1 dell'expander, già rilasciato
# (OUTPUT=0xFF nel setup di io_extension_ws). Il GT911 si auto-inizializza a 0x5D.
touchscreen:
  - platform: gt911
    id: my_touch
    interrupt_pin: GPIO4
    address: 0x5D
    # reset hardware del GT911 via IO1 dell'expander -> init affidabile ad ogni boot
    reset_pin:
      io_extension_ws: io_ext
      number: 1
      mode:
        output: true

