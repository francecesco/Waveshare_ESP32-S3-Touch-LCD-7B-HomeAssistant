    id: um_giardino
    entity_id: !secret ent_um_giardino
    on_value:
      - lvgl.label.update:
          id: lbl_um_g
          text: !lambda 'return str_sprintf("%.0f%%", x);'
      - lvgl.label.update:
          id: lbl_g_um
          text: !lambda 'return str_sprintf("%.0f%%", x);'
  - platform: homeassistant
    id: um_sala
    entity_id: !secret ent_um_sala
    on_value:
      - lvgl.label.update:
          id: lbl_um_s
          text: !lambda 'return str_sprintf("%.0f%%", x);'
  - platform: homeassistant
    id: um_camera
    entity_id: !secret ent_um_camera
    on_value:
      - lvgl.label.update:
          id: lbl_um_c
          text: !lambda 'return str_sprintf("%.0f%%", x);'
  # --- Energia ---
  - platform: homeassistant
    id: potenza
    entity_id: !secret ent_potenza
    on_value:
      - lvgl.label.update:
          id: lbl_pot
