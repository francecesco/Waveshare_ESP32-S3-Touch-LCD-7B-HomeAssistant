    on_value:
      - lvgl.label.update:
          id: lbl_t_c
          text: !lambda 'return str_sprintf("%.1f°", x);'
  # --- Energia (pagina Energia) ---
  - platform: homeassistant
    id: costo_oggi
    entity_id: !secret ent_costo_oggi
    on_value:
      - lvgl.label.update:
          id: lbl_e_oggi
          text: !lambda 'return str_sprintf("%.2f €", x);'
  - platform: homeassistant
    id: costo_mese_prec
    entity_id: !secret ent_costo_mese_prec
    on_value:
      - lvgl.label.update:
          id: lbl_e_prec
          text: !lambda 'return str_sprintf("%.2f €", x);'
  - platform: homeassistant
    id: consumo_mensile
    entity_id: !secret ent_consumo_mensile
    on_value:
      - lvgl.label.update:
          id: lbl_e_consumo
          text: !lambda 'return str_sprintf("%.0f kWh", x);'
  - platform: homeassistant
    id: tesla_costo
    entity_id: !secret ent_tesla_costo
    on_value:
      - lvgl.label.update:
          id: lbl_e_tesla_eur
          text: !lambda 'return str_sprintf("%.2f €", x);'
  - platform: homeassistant
    id: tesla_kwh_f1
    entity_id: !secret ent_tesla_kwh_f1
    on_value:
      - lvgl.label.update:
          id: lbl_e_tesla_kwh
          text: !lambda |-
            // In HA non esiste piu' un totale mensile: si somma per fascia.
            // Le fasce non ancora ricevute sono NaN -> valgono 0.
            auto v = [](float s) { return std::isnan(s) ? 0.0f : s; };
            return str_sprintf("%.0f kWh",
                v(id(tesla_kwh_f1).state) + v(id(tesla_kwh_f2).state) + v(id(tesla_kwh_f3).state));
  - platform: homeassistant
    id: tesla_kwh_f2
    entity_id: !secret ent_tesla_kwh_f2
    on_value:
