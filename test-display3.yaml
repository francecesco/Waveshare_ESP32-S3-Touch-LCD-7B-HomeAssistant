            // In HA non esiste piu' un totale mensile: si somma per fascia.
            // Le fasce non ancora ricevute sono NaN -> valgono 0.
            auto v = [](float s) { return std::isnan(s) ? 0.0f : s; };
            return str_sprintf("%.0f kWh",
                v(id(tesla_kwh_f1).state) + v(id(tesla_kwh_f2).state) + v(id(tesla_kwh_f3).state));
  - platform: homeassistant
    id: tesla_kwh_f3
    entity_id: !secret ent_tesla_kwh_f3
    on_value:
      - lvgl.label.update:
          id: lbl_e_tesla_kwh
          text: !lambda |-
            // In HA non esiste piu' un totale mensile: si somma per fascia.
            // Le fasce non ancora ricevute sono NaN -> valgono 0.
            auto v = [](float s) { return std::isnan(s) ? 0.0f : s; };
            return str_sprintf("%.0f kWh",
                v(id(tesla_kwh_f1).state) + v(id(tesla_kwh_f2).state) + v(id(tesla_kwh_f3).state));
  # --- Giardino: consumo cucina esterna ---
  - platform: homeassistant
    id: consumo_cucina
    entity_id: !secret ent_consumo_cucina
    on_value:
      - lvgl.label.update:
          id: lbl_g_consumo
          text: !lambda 'return str_sprintf("%.0f W", x);'

# --- Persone (stato casa/fuori) ---
text_sensor:
  - platform: homeassistant
    id: pers_1
    entity_id: !secret ent_persona1
    on_value:
      - lvgl.label.update:
          id: lbl_fra
          text: !lambda 'return x == "home" ? std::string("Casa") : std::string("Fuori");'
          text_color: !lambda 'return x == "home" ? lv_color_hex(0x8FBF9F) : lv_color_hex(0x848D9C);'
  - platform: homeassistant
    id: pers_2
    entity_id: !secret ent_persona2
    on_value:
      - lvgl.label.update:
          id: lbl_cos
          text: !lambda 'return x == "home" ? std::string("Casa") : std::string("Fuori");'
          text_color: !lambda 'return x == "home" ? lv_color_hex(0x8FBF9F) : lv_color_hex(0x848D9C);'
  # --- Meteo: condizione -> icona MDI e colore ---
  # I glifi sono scritti come universal-character-name C++ (\UXXXXXXXX):
  # qui siamo in un block scalar, YAML non interpreta gli escape, lo fa il compilatore.
  - platform: homeassistant
    id: meteo_cond
    entity_id: !secret ent_meteo
    on_value:
      - lvgl.label.update:
          id: lbl_meteo_icon
          text: !lambda |-
            if (x == "sunny")           return std::string("\U000F0599");
            if (x == "clear-night")     return std::string("\U000F0594");
            if (x == "partlycloudy")    return std::string("\U000F0595");
            if (x == "cloudy")          return std::string("\U000F0590");
            if (x == "fog")             return std::string("\U000F0591");
            if (x == "hail")            return std::string("\U000F0592");
            if (x == "lightning")       return std::string("\U000F0593");
            if (x == "lightning-rainy") return std::string("\U000F067E");
            if (x == "pouring")         return std::string("\U000F0596");
            if (x == "rainy")           return std::string("\U000F0597");
            if (x == "snowy")           return std::string("\U000F0598");
            if (x == "snowy-rainy")     return std::string("\U000F067F");
            if (x == "windy")           return std::string("\U000F059D");
            if (x == "windy-variant")   return std::string("\U000F059E");
            if (x == "exceptional")     return std::string("\U000F05D6");
            return std::string("\U000F0590");  // stato ignoto -> nuvoloso
          text_color: !lambda |-
            // sole ambra, notte indaco, pioggia/temporale blu, neve/nebbia chiaro,
            // nuvole/vento grigio, exceptional rosso.
            if (x == "sunny")           return lv_color_hex(0xFFD54F);
            if (x == "clear-night")     return lv_color_hex(0x9FA8DA);
            if (x == "partlycloudy")    return lv_color_hex(0xB0BEC5);
            if (x == "fog")             return lv_color_hex(0xCFD8DC);
            if (x == "hail")            return lv_color_hex(0xB3E5FC);
            if (x == "snowy")           return lv_color_hex(0xE1F5FE);
            if (x == "snowy-rainy")     return lv_color_hex(0xB3E5FC);
            if (x == "rainy")           return lv_color_hex(0x4FC3F7);
            if (x == "pouring")         return lv_color_hex(0x4FC3F7);
            if (x == "lightning")       return lv_color_hex(0x4FC3F7);
            if (x == "lightning-rainy") return lv_color_hex(0x4FC3F7);
            if (x == "exceptional")     return lv_color_hex(0xEF5350);
            return lv_color_hex(0x9AA0B0);
  # Stato robot aspirapolvere (pagina Casa)
  - platform: homeassistant
    id: st_vacuum
    entity_id: !secret ent_vacuum
    on_value:
      - lvgl.label.update:
          id: lbl_igor
          text: !lambda |-
            if (x == "cleaning") return std::string("In pulizia");
            if (x == "docked") return std::string("In carica");
            if (x == "returning") return std::string("Rientro");
            if (x == "paused") return std::string("In pausa");
            if (x == "idle") return std::string("Fermo");
            if (x == "error") return std::string("Errore");
            return x;

